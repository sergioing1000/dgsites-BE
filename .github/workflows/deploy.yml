name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install dependencies (reproducible lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run ruff check
        run: ruff check .

      - name: Run mypy type check
        run: mypy app/ main.py

      - name: Verify build
        run: python -m py_compile main.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

  deploy-staging:
    name: Deploy to Render Staging
    needs: validate
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Deploy to Render Staging
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY}" ] || [ -z "${RENDER_SERVICE_ID}" ]; then
            echo "::error::Missing Render secrets (RENDER_API_KEY/RENDER_SERVICE_ID). Configure them in the 'staging' environment secrets before deploying."
            exit 1
          fi
          echo "Deploying to Render Staging (commit ${{ github.sha }})..."
          curl --fail-with-body --retry 3 --max-time 30 \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"commitId":"${{ github.sha }}"}'

  tag:
    name: Generate SemVer tag
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            # No previous tag exists — first release is always v1.0.0
            NEW_VERSION="v1.0.0"
            echo "No previous tag found; first release will be $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Proposed new tag: $NEW_VERSION"
            exit 0
          fi

          # Tag exists — check if it already points to HEAD (idempotent re-run)
          TAG_COMMIT=$(git rev-list -n 1 "$LAST_TAG")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
            echo "Last tag $LAST_TAG already points to HEAD; reusing it"
            echo "new_version=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "Proposed new tag: $LAST_TAG"
            exit 0
          fi

          # Tag exists and points to an older commit — calculate semantic bump
          echo "Last tag: $LAST_TAG"
          COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"

          if echo "$COMMITS" | grep -q "^.*feat"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -q "^.*fix"; then
            BUMP="patch"
          else
            BUMP="patch"
          fi

          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Proposed new tag: $NEW_VERSION"

      - name: Create and push tag
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$NEW_VERSION")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
              echo "Tag $NEW_VERSION already exists and points to current HEAD; reusing it"
              exit 0
            else
              echo "::error::Tag $NEW_VERSION already exists pointing to $TAG_COMMIT but HEAD is $HEAD_COMMIT; aborting to avoid conflict"
              exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"

  deploy-production:
    name: Deploy to Render Production
    needs: [validate, tag]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy to Render Production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RELEASE_VERSION: ${{ needs.tag.outputs.new_version }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY}" ] || [ -z "${RENDER_SERVICE_ID}" ]; then
            echo "::error::Missing Render secrets (RENDER_API_KEY/RENDER_SERVICE_ID). Configure them in the 'production' environment secrets before deploying."
            exit 1
          fi
          echo "Deploying to Render Production (commit ${{ github.sha }}, release ${RELEASE_VERSION})..."
          curl --fail-with-body --retry 3 --max-time 30 \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"commitId":"${{ github.sha }}"}'

  release:
    name: Create GitHub Release
    needs: [validate, tag, deploy-production]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.tag.outputs.new_version }}
          name: Release ${{ needs.tag.outputs.new_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
